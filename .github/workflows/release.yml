name: Create Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example, v3.17.0.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_TYPE: stable
    steps:
      - name: Determine version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # HMCL's build script derives "<VERSION_ROOT>.<BUILD_NUMBER>", so
          # split a numeric tag such as v3.17.0.1 into 3.17.0 and 1.
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Tag '$TAG' is not a release tag such as v3.17.0.1"
            exit 1
          fi

          VERSION="${TAG#v}"
          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "VERSION_ROOT=${VERSION%.*}"
            echo "BUILD_NUMBER=${VERSION##*.}"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Build artifacts
        run: xvfb-run --auto-servernum ./gradlew :HMCL:makeExecutables :HMCL:makeDeb --no-daemon --parallel --stacktrace
        env:
          GITHUB_SHA: ${{ steps.commit.outputs.sha }}
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Verify artifacts
        run: |
          cd HMCL/build/libs
          for ext in jar exe sh deb; do
            file="HMCL-${VERSION}.${ext}"
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
            test -f "$file.sha256" || { echo "::error::Missing $file.sha256"; exit 1; }
            echo "$(cat "$file.sha256")  $file" | sha256sum -c -
          done

      - name: Generate release notes
        env:
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "Built from commit [\`${RELEASE_COMMIT:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${RELEASE_COMMIT})."
            echo
            echo "| File | SHA-256 Checksum |"
            echo "| --- | --- |"
            for ext in exe jar sh deb; do
              file="HMCL-${VERSION}.${ext}"
              checksum="$(cat "HMCL/build/libs/${file}.sha256")"
              echo "| [${file}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${file}) | \`${checksum}\` |"
            done
          } > RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            "HMCL/build/libs/HMCL-${VERSION}.exe"
            "HMCL/build/libs/HMCL-${VERSION}.jar"
            "HMCL/build/libs/HMCL-${VERSION}.sh"
            "HMCL/build/libs/HMCL-${VERSION}.deb"
          )

          # Re-running a partially failed release must not fail on the existing
          # release; refresh its assets and notes instead. A new release is
          # created as a regular (non-prerelease) latest release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
